name: Deploy Just Africa to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/portal.js
          node --check assets/js/listings.js
      - name: Validate platform structure and RLS baseline
        run: node scripts/validate-platform.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site files (excludes docs, SQL, scripts and unlinked drafts)
        run: |
          mkdir _site
          cp index.html destinations.html guides.html listings.html partners.html \
             account.html dashboard.html privacy.html terms.html contact.html areas.html area.html hotel.html 404.html \
             robots.txt sitemap.xml _site/
          cp -r assets _site/assets
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
